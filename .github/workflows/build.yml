name: Build y pruebas

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Compilar solución (Release)
        run: msbuild Ada369Csharp.sln /p:Configuration=Release /restore /m /nologo /v:m

      - name: Ejecutar pruebas
        run: .\Ada369Csharp.Tests\bin\Release\Ada369Csharp.Tests.exe
